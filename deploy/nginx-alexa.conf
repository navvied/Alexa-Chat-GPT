# /etc/nginx/sites-available/alexa.conf  (replace alexa.example.com with your subdomain)
#
# This is the HTTP-only starting point. `certbot --nginx -d alexa.example.com` then adds
# the HTTPS listener on port 443 and the redirect from HTTP. Alexa only calls HTTPS on 443.

server {
    listen 80;
    listen [::]:80;
    server_name alexa.example.com;

    # Only the skill endpoint and the health check are exposed; everything else is 404.
    location = /alexa {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 256k;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        return 404;
    }
}
